<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 652" width="960" height="652" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="960" height="652" fill="#FAFAF9"/>

  <text x="40" y="46" font-size="23" font-weight="600" fill="#22252A">Six gates, three owners, three different fixes</text>
  <text x="40" y="72" font-size="14.5" fill="#6B7280">One blended number is true and useless. The narrowest pipe sets the flow, and you can only see it per stage.</text>

  <!-- rows -->
  <g>
    <rect x="40" y="104" width="620" height="40" rx="7" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1.3"/>
    <rect x="40" y="104" width="7" height="40" rx="3.5" fill="#3B6EA5"/>
    <text x="62" y="122" font-size="12.5" font-weight="700" fill="#22252A">1 &#183; Trained</text>
    <text x="62" y="138" font-size="11.5" fill="#6B7280">Does this entity have a model at all?</text>
    <rect x="674" y="112" width="120" height="24" rx="12" fill="#EEF3F8" stroke="#3B6EA5" stroke-width="1.2"/>
    <text x="734" y="128" font-size="11" font-weight="700" fill="#1F3F63" text-anchor="middle">AVAILABILITY</text>
    <text x="812" y="128" font-size="11" fill="#8A8F98">training pipeline</text>
  </g>

  <g>
    <rect x="40" y="152" width="620" height="40" rx="7" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1.3"/>
    <rect x="40" y="152" width="7" height="40" rx="3.5" fill="#3B6EA5"/>
    <text x="62" y="170" font-size="12.5" font-weight="700" fill="#22252A">2 &#183; Artifact present</text>
    <text x="62" y="186" font-size="11.5" fill="#6B7280">Is it still in storage, or did it quietly expire?</text>
    <rect x="674" y="160" width="120" height="24" rx="12" fill="#EEF3F8" stroke="#3B6EA5" stroke-width="1.2"/>
    <text x="734" y="176" font-size="11" font-weight="700" fill="#1F3F63" text-anchor="middle">AVAILABILITY</text>
    <text x="812" y="176" font-size="11" fill="#8A8F98">retention + scheduler</text>
  </g>

  <g>
    <rect x="40" y="200" width="620" height="40" rx="7" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1.3"/>
    <rect x="40" y="200" width="7" height="40" rx="3.5" fill="#2F6B4F"/>
    <text x="62" y="218" font-size="12.5" font-weight="700" fill="#22252A">3 &#183; Model loads</text>
    <text x="62" y="234" font-size="11.5" fill="#6B7280">Does it deserialise without a transient error?</text>
    <rect x="674" y="208" width="120" height="24" rx="12" fill="#F1F7F3" stroke="#2F6B4F" stroke-width="1.2"/>
    <text x="734" y="224" font-size="11" font-weight="700" fill="#1F4A37" text-anchor="middle">RELIABILITY</text>
    <text x="812" y="224" font-size="11" fill="#8A8F98">inference service</text>
  </g>

  <g>
    <rect x="40" y="248" width="620" height="40" rx="7" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1.3"/>
    <rect x="40" y="248" width="7" height="40" rx="3.5" fill="#2F6B4F"/>
    <text x="62" y="266" font-size="12.5" font-weight="700" fill="#22252A">4 &#183; Features retrievable</text>
    <text x="62" y="282" font-size="11.5" fill="#6B7280">A model that loads but has no features still fails the user.</text>
    <rect x="674" y="256" width="120" height="24" rx="12" fill="#F1F7F3" stroke="#2F6B4F" stroke-width="1.2"/>
    <text x="734" y="272" font-size="11" font-weight="700" fill="#1F4A37" text-anchor="middle">RELIABILITY</text>
    <text x="812" y="272" font-size="11" fill="#8A8F98">lookup + feature store</text>
  </g>

  <g>
    <rect x="40" y="296" width="620" height="40" rx="7" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1.3"/>
    <rect x="40" y="296" width="7" height="40" rx="3.5" fill="#7A8C3F"/>
    <text x="62" y="314" font-size="12.5" font-weight="700" fill="#22252A">5 &#183; Confident prediction</text>
    <text x="62" y="330" font-size="11.5" fill="#6B7280">Does it commit to signal or noise, or shrug?</text>
    <rect x="674" y="304" width="120" height="24" rx="12" fill="#F5F7EC" stroke="#7A8C3F" stroke-width="1.2"/>
    <text x="734" y="320" font-size="10.5" font-weight="700" fill="#4E5A22" text-anchor="middle">BOTH &#8594; ACCURACY</text>
    <text x="812" y="320" font-size="11" fill="#8A8F98">baseline, then handed on</text>
  </g>

  <g>
    <rect x="40" y="344" width="620" height="40" rx="7" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1.3"/>
    <rect x="40" y="344" width="7" height="40" rx="3.5" fill="#B4485A"/>
    <text x="62" y="362" font-size="12.5" font-weight="700" fill="#22252A">6 &#183; Correct</text>
    <text x="62" y="378" font-size="11.5" fill="#6B7280">Is the confident answer right, and did we quiet anything real?</text>
    <rect x="674" y="352" width="120" height="24" rx="12" fill="#FDF2F4" stroke="#B4485A" stroke-width="1.2"/>
    <text x="734" y="368" font-size="11" font-weight="700" fill="#8C2F40" text-anchor="middle">ACCURACY</text>
    <text x="812" y="368" font-size="11" fill="#8A8F98">parts one and two</text>
  </g>

  <!-- measured snapshot -->
  <rect x="40" y="410" width="880" height="216" rx="10" fill="#FFFFFF" stroke="#D6D3CE" stroke-width="1.4"/>
  <text x="60" y="438" font-size="13.5" font-weight="700" fill="#22252A">Where the drop actually was &#183; one week, measured after the instrument was fixed</text>
  <text x="60" y="457" font-size="11.5" fill="#8A8F98">Attribution before optimisation. Both upstream stages had engaged owners. Neither was the constraint.</text>

  <!-- proportional bars -->
  <text x="60" y="490" font-size="11.5" fill="#4A5568">incoming requests</text>
  <rect x="230" y="478" width="640" height="16" rx="4" fill="#3B6EA5"/>
  <text x="878" y="490" font-size="11" font-weight="700" fill="#4A5568">100%</text>

  <text x="60" y="518" font-size="11.5" fill="#4A5568">after candidate lookup</text>
  <rect x="230" y="506" width="594" height="16" rx="4" fill="#3B6EA5"/>
  <text x="832" y="518" font-size="11" font-weight="700" fill="#B4485A">&#8722;7.16%</text>

  <text x="60" y="546" font-size="11.5" fill="#4A5568">after feature store fetch</text>
  <rect x="230" y="534" width="584" height="16" rx="4" fill="#3B6EA5"/>
  <text x="822" y="546" font-size="11" font-weight="700" fill="#B4485A">&#8722;1.65%</text>

  <text x="60" y="574" font-size="11.5" fill="#4A5568">after model load and predict</text>
  <rect x="230" y="562" width="125" height="16" rx="4" fill="#B4485A"/>
  <text x="363" y="574" font-size="11" font-weight="700" fill="#B4485A">&#8722;71.6%</text>

  <text x="60" y="601" font-size="12" font-weight="700" fill="#22252A">end-to-end coverage: 19.6%</text>
  <text x="260" y="596" font-size="11.5" fill="#4A5568">The model stage owned ~89% of the gap. Fixing both upstream stages perfectly buys ~9 points.</text>
  <text x="260" y="613" font-size="11.5" fill="#4A5568">Draining the model backlog takes coverage from under 20% to over 90% without touching them at all.</text>
</svg>
